name: kafoo_ui
description: Shared widgets and the Kafoo design system.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  flutter: '>=3.27.0'
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# THE DESIGNED TYPEFACE, BUNDLED. Without these lines every screen renders in whatever the
# handset defaults to — legible, but not the face the design's sunlight-legibility argument
# rests on, and different on every phone. Like `uses-material-design`, no test can see this:
# widget tests do not load real fonts, so the gate greps for the files instead (verify.sh,
# "android release build sanity").
#
# Three weights, because the type scale uses exactly three. Adding Light or Medium costs
# ~240 KB of APK each for a weight nothing asks for.
#
# Declared here rather than in apps/mobile so the web build and any future app get the same
# face from one place. The cost of that choice is the `packages/kafoo_ui/` prefix on the
# family name in typography.dart — Flutter's required spelling for a font a package owns.
flutter:
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
