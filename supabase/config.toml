# Local Supabase stack. Ports are forwarded by .devcontainer/devcontainer.json.
project_id = "kafoo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match the deployed project, which runs Postgres 17. This said 15 until 2026-08-01, so every
# migration was authored and tested against a different major version than the one it would be
# applied to — the classic source of "it worked locally". Check with:
#   curl -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
#     https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF
# Changing this invalidates an existing local volume; `supabase db reset` rebuilds it.
major_version = 17

# seed.sql installs pgTAP and the `tests` helper schema the authorization suites need.
#
# Runs locally and on git-linked preview branches; not on production, and not on a branch created by
# hand. All four cases were measured on 2026-08-02 and are listed in the header of seed.sql — read
# that before assuming the test harness exists in any particular environment.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_confirmations = true


# No leading `+` on these keys, and that is not a typo — do not "fix" it.
#
# The deployed config API rejects the `+` outright: applying a branch with it returns
#   400 sms_test_otp: Must be a comma separated list of <phone-number>=<code>.
#              Phone numbers are in E.164 without the leading + sign.
# which is how the first preview branch failed on 2026-08-02, before it got as far as migrations.
# The local stack accepted the `+` quietly, so this survived from E1 until a deployed environment
# finally read the same file.
#
# Callers still use full E.164 *with* the `+` — supabase/functions/delete-account/index.test.ts
# signs in as `+201000000001`, and docs/ops/verifying-e1.md tells a human to type it that way. The
# asymmetry is real: the `+` belongs on the number a client sends, not on the key that looks it up.
[auth.sms.test_otp]
"201000000001" = "000001"
"201000000002" = "000002"
"201000000003" = "000003"

[storage]
enabled = true
file_size_limit = "50MiB"


# EDGE FUNCTIONS MUST BE DECLARED HERE OR THEY DO NOT DEPLOY.
#
# Supabase Branching deploys only the functions named in this file. Nothing was named until
# 2026-08-02, so `delete-account` — E1's account-removal function — has never been deployed to a
# preview branch. Every preview build said so, in a warning nobody read:
#
#   Docker is not running. Functions will not be deployed.
#   ... only Functions declared in config.toml will be deployed to branches
#
# The consequence is not cosmetic. It invalidates any "verified on the preview branch" claim about
# a function: the preview branch had no function to verify. `docs/ops/verifying-e1.md` §6 walks a
# human through deleting their account against a deployed environment, and on a preview branch that
# walkthrough was exercising nothing.
#
# One entry per function, added in the same change that adds the function. A function directory
# with no entry here is code that runs everywhere except where it is tested.
#
# `verify_jwt = true` makes the platform reject an unauthenticated request before the function is
# invoked. It is a second lock, not the lock: both functions read identity from the verified JWT
# themselves and must keep doing so, because this setting is configuration and configuration can be
# changed by someone who is not reading the function.
[functions.delete-account]
enabled = true
verify_jwt = true

[functions.analyze-meal]
enabled = true
verify_jwt = true

# THE THREE BELOW WERE MISSING UNTIL 2026-08-08, so E3's search had never been deployed anywhere —
# not to a preview branch, not to the demo database, NOT TO PRODUCTION. `discover` returned 404 on
# every environment while its unit tests, its type-check and the whole gate stayed green, because
# nothing in the gate asks whether a function that exists is a function that runs.
#
# This is the exact failure the header above describes, recorded when `delete-account` hit it, and
# repeated because the rule lives here and the person adding a function is reading the function.
#
# `verify_jwt = true` ON A SURFACE THAT WORKS WITHOUT AN ACCOUNT, which reads like a contradiction
# and is not. Measured on 2026-08-08 against the deployed `analyze-meal`: a request carrying only
# the publishable key PASSES the platform gate and reaches the function, while a request with no
# Authorization header at all is refused by the platform with UNAUTHORIZED_NO_AUTH_HEADER. So a
# signed-out Customer holding the app's own key gets through and the open internet does not.
#
# That distinction is worth having rather than reaching for `verify_jwt = false`. `discover` calls a
# paid embedding provider on every request, so an endpoint reachable with no credential at all is a
# metered endpoint anyone can run up. Signed-out is not the same as unauthenticated, and only one of
# the two needs to work.
#
# `discover` and `judge-results` do NOT read identity from the token — they pass the caller's own
# Authorization header to the database and let RLS answer, which is what makes discovery work
# without an account. `embed-meal` does hold a service-role key and its authorization is its own,
# narrowed by `20260807064927` to a single column.
[functions.discover]
enabled = true
verify_jwt = true

[functions.judge-results]
enabled = true
verify_jwt = true

[functions.embed-meal]
enabled = true
verify_jwt = true

# Turns a Kafoo sentence into Cairene speech. Holds ELEVENLABS_API_KEY, no
# database client and no write path — see the banner in its index.ts for why the
# key cannot live in the app instead.
[functions.speak]
enabled = true
verify_jwt = true

# ADR-0017. Mints the short-lived signed URL the app opens one voice
# conversation with. `verify_jwt` is on: only a signed-in person may spend the
# account's conversation minutes, and the credential it returns is a bearer
# token for fifteen minutes.
[functions.agent-session]
enabled = true
verify_jwt = true
