# Local Supabase stack. Ports are forwarded by .devcontainer/devcontainer.json.
project_id = "kafoo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_confirmations = true

[[auth.sms.test_otp]]
phone = "+201000000001"
otp = "000001"

[[auth.sms.test_otp]]
phone = "+201000000002"
otp = "000002"

[storage]
enabled = true
file_size_limit = "50MiB"

[[storage.buckets]]
name = "kitchen-photos"
public = true
file_size_limit = "50MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]
