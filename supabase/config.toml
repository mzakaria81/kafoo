# Local Supabase stack. Ports are forwarded by .devcontainer/devcontainer.json.
project_id = "kafoo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# seed.sql installs pgTAP and the `tests` helper schema the authorization suites need.
# Local only — seeds never run against a deployed project, which is deliberate: helpers that
# create auth users have no business in production.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_confirmations = true

[auth.sms.test_otp]
"+201000000001" = "000001"
"+201000000002" = "000002"

[storage]
enabled = true
file_size_limit = "50MiB"
