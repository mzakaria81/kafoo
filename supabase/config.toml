# Local Supabase stack. Ports are forwarded by .devcontainer/devcontainer.json.
project_id = "kafoo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match the deployed project, which runs Postgres 17. This said 15 until 2026-08-01, so every
# migration was authored and tested against a different major version than the one it would be
# applied to — the classic source of "it worked locally". Check with:
#   curl -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
#     https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF
# Changing this invalidates an existing local volume; `supabase db reset` rebuilds it.
major_version = 17

# seed.sql installs pgTAP and the `tests` helper schema the authorization suites need.
#
# This runs locally AND on every preview branch. It does NOT run on production: `supabase db push`
# applies migrations only. That split is the point — a preview branch is disposable and wants the
# test harness; production is neither.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_confirmations = true

[auth.sms.test_otp]
"+201000000001" = "000001"
"+201000000002" = "000002"

[storage]
enabled = true
file_size_limit = "50MiB"
