name: kafoo

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Analyze every package. Infos are fatal - a lint we chose to enable is a lint we mean.
    run: melos exec -- dart analyze --fatal-infos --fatal-warnings .

  test:
    description: Run tests in every package that has a test directory.
    run: |
      melos exec --no-flutter --dir-exists=test -- dart test
      melos exec --flutter --dir-exists=test -- flutter test

  format:
    description: Format every package in place. CI checks formatting via scripts/verify.sh.
    run: melos exec -- dart format .
