name: kafoo_mobile
description: The Kafoo app. Customer and Cook in one binary.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  flutter: '>=3.27.0'
  sdk: ^3.6.0

dependencies:
  # PLAYS THE PAID VOICE'S AUDIO, AND flutter_tts CANNOT.
  #
  # `flutter_tts` speaks text through the platform engine and owns its own
  # playback; it has no way to play mp3 bytes that arrived from somewhere else.
  # The Cairene voices come back from Kafoo's `speak` function as bytes, so
  # something has to play them. Chosen over `just_audio` because it accepts a
  # byte buffer directly (`BytesSource`) — `just_audio` wants a URI or a stream,
  # which would mean writing every sentence to a temporary file first.
  audioplayers: ^6.1.0
  # Names a bundled voice clip after the SHA-1 of the sentence it says, so the app can ask "do I
  # already own these exact words" — see `voice_clip_store.dart`. Declared directly rather than
  # leant on through supabase_flutter, which already pulls it in: a transitive dependency is a
  # dependency somebody else may drop, and every clip would miss silently the day it went.
  crypto: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_tts: ^4.2.5
  image_picker: ^1.1.0
  kafoo_ai:
    path: ../../packages/ai
  kafoo_domain:
    path: ../../packages/domain
  kafoo_ui:
    path: ../../packages/ui
  # Where a sentence bought at runtime is kept so the next launch does not buy it again. Two
  # sentences need this — the Meal-list greeting, which carries the Cook's own Meal counts, and the
  # row's «اسمعيها», which reads back a Meal's own name and price. Declared directly for the same
  # reason as `crypto` above.
  path_provider: ^2.1.0
  riverpod_annotation: ^4.0.3
  # A Customer's answer about their own words lives HERE and not in Kafoo — FR-029d. Declared
  # directly rather than leant on through supabase_flutter, which already pulls it in: a transitive
  # dependency is a dependency somebody else may drop, and the day it went would take the answer
  # with it and start asking again.
  shared_preferences: ^2.3.0
  speech_to_text: ^7.0.0
  supabase_flutter: ^2.9.0

flutter:
  generate: true

  # THE 36 SENTENCES KAFOO OWNS OUTRIGHT, IN BOTH CAIRENE VOICES.
  #
  # Generated once by `scripts/generate-voice-clips.ts` and committed. The provider bills per
  # character generated, so a sentence with no variable in it — «تمام، شلتها من المنيو», every
  # conversation question, every read-back before «أيوة» — was being re-bought on every launch for
  # words that have never changed. 2,496 characters bought these outright, and they now cost nothing
  # for every Cook there will ever be.
  #
  # 3.5 MB, and it buys more than the money. A bundled clip plays in milliseconds with no signal at
  # all, so it cannot lose the race `_fetchTimeout` bounds — a Cook on the metro hears a Cairene
  # voice rather than the machine one.
  #
  # DIRECTORIES, NOT FILENAMES, because the filenames are hashes of the Arabic and change whenever
  # the wording does. Listing them individually would mean this file going stale every time somebody
  # edits a string, which is the failure mode a generated name exists to avoid.
  assets:
    - assets/voice/female/
    - assets/voice/male/

  # BUNDLES THE ICON FONT, AND WITHOUT IT EVERY `Icon` IS A CHINESE CHARACTER.
  #
  # Material icons are codepoints in the Unicode Private Use Area, and this line is the only thing
  # that ships the font mapping them to pictures. Missing, Android falls back down the system font
  # chain to a CJK font — which maps the same Private Use Area to ideographs — so the microphone
  # rendered as 爆 and settings as 燃 in the first demo APK, 2026-08-07.
  #
  # It is invisible in every check Kafoo runs: widget tests render text without loading real fonts,
  # `flutter analyze` does not read the asset bundle, and the app had never been built for a phone
  # before. The gate cannot catch this one — a person looking at a screen is what caught it.
  uses-material-design: true

  # IBM PLEX SANS ARABIC, BUNDLED RATHER THAN FETCHED.
  #
  # Until 2026-08-10 Kafoo declared no font at all, so every Arabic glyph came from whatever the
  # handset happened to install — which means the app looked different on every phone and nobody had
  # chosen how it looked on any of them.
  #
  # Bundled, not `google_fonts`: that package downloads at first render, and on an Egyptian mobile
  # network that is a visible blank screen followed by a reflow of every line on the page. 968 KB in
  # the APK is the right trade against a Cook watching text appear twice.
  #
  # Four weights, not eight. 400/500/600/700 are what the type scale uses; 100/200/300 are below the
  # 400 floor the design sets for Arabic body text, because thin strokes vanish in sunlight.
  #
  # SIL Open Font License 1.1. Bundling and redistribution are permitted.
  #
  # THE .txt BESIDE THESE FILES DOES NOT SHIP, and this comment claimed it did until somebody built
  # the asset bundle and looked. Flutter bundles what it is told to bundle; there is no `assets:`
  # section here, so only the four .ttf files are packaged. The notice travels INSIDE them — each face
  # carries the copyright, the OFL statement and the licence URL in its own metadata, which is a form
  # the OFL explicitly accepts. Attribution is therefore satisfied by the binary, not by the .txt.
  #
  # The .txt stays in the repository as provenance for whoever next touches these fonts. Do not add it
  # under `assets:`: that ships 4 KB no code reads and no person can see, which satisfies nothing the
  # font metadata does not already satisfy. `LicenseRegistry` in main.dart is what makes it readable.
  #
  # The faces are unmodified upstream v1.005, so the OFL's reserved-name clause does not apply — it
  # binds Modified Versions only. **A subset IS a modified version**, so if apps/web ever self-hosts a
  # woff2 subset, that subset must be renamed away from "Plex".
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.4
