version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  flutter: '>=3.27.0'
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  image_picker: ^1.1.0
  kafoo_ai:
    path: ../../packages/ai
