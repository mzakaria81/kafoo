name: Demo APK

# AN ANDROID APP THE FOUNDER CAN ACTUALLY INSTALL, WHICH UNTIL 2026-08-07 DID NOT EXIST.
#
# `deploy.yml` archives an `.aab` on every merge to main. That is a Play Store upload format and it
# cannot be installed on a phone — and it is built with no `--dart-define`, so `main()` throws
# before the first frame on a missing SUPABASE_URL. Both facts together mean every "release
# candidate" archived so far is an app that cannot start. Neither is a bug in this workflow's
# scope to fix; deploy.yml is aimed at the stores and both properties are correct there.
#
# What was missing is a build aimed at a person holding a phone. That is this.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# IT POINTS AT THE DEMO DATABASE, NEVER AT PRODUCTION.
#
# The demo data in supabase/demo-data.json creates Cooks and Meals, and
# `.claude/rules/business-rules.md` calls synthetic Cooks and Meals on the real marketplace
# product-fatal. So the check below refuses the production ref outright — that refusal is the
# control, and it is why the address can safely be stored rather than typed.
#
# THE ADDRESS IS A REPOSITORY VARIABLE, NOT A SECRET, AND NOT AN INPUT. The demo database became
# PERMANENT on 2026-08-07 (founder's decision, docs/ops/preview-branches.md), so its address stopped
# changing and there is nothing left to retype. A variable rather than a secret because a variable
# is READABLE: anyone can check at a glance which database a build pointed at, which is exactly the
# question worth being able to answer about a build somebody installed on their phone. The
# publishable key is a client key that ships inside every APK anyway — hiding it in a secret would
# be theatre.
#
# The inputs are still here as an override, for pointing a build at a throwaway pull-request branch
# without touching the stored address.
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# The APK is DEBUG-SIGNED and that is deliberate: apps/mobile/android/app/build.gradle.kts falls
# back to debug keys when key.properties is absent, and a debug-signed APK sideloads fine. It is not
# publishable, which is the correct property for a build carrying demo data.

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Override the demo database URL. Leave empty to use DEMO_SUPABASE_URL.'
        required: false
      publishable_key:
        description: 'Override the demo publishable key. Leave empty to use DEMO_SUPABASE_PUBLISHABLE_KEY.'
        required: false

jobs:
  apk:
    name: demo apk
    runs-on: ubuntu-latest
    env:
      # An input wins when given; otherwise the stored demo address. Resolved once, here, so every
      # step below reads the same value and the refusal cannot be checking a different one from the
      # build.
      URL: ${{ inputs.supabase_url || vars.DEMO_SUPABASE_URL }}
      KEY: ${{ inputs.publishable_key || vars.DEMO_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      # The one thing this workflow must refuse. The production ref is public in the repository's
      # own CI configuration, so comparing against it needs no secret.
      - name: Refuse production, and refuse an empty address
        run: |
          if [ -z "${URL}" ] || [ -z "${KEY}" ]; then
            echo "::error::No demo database configured. Set the repository variables" \
                 "DEMO_SUPABASE_URL and DEMO_SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and" \
                 "variables → Actions → Variables), or pass them as inputs."
            echo "::error::Empty is refused rather than defaulted, because String.fromEnvironment" \
                 "answers \"\" for a name nobody defined and the app would build and then throw."
            exit 1
          fi
          if [ "${URL}" = "https://cshrkpvljknxsdzwhhle.supabase.co" ]; then
            echo "::error::That is the production project. This build carries demo Cooks and Meals," \
                 "which business-rules.md calls product-fatal on the real marketplace."
            exit 1
          fi
          case "${URL}" in
            https://*.supabase.co) ;;
            *) echo "::error::Expected a https://<ref>.supabase.co URL."; exit 1 ;;
          esac
          echo "Building against ${URL}"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      # `*.g.dart` is gitignored, so a clean checkout has none of it and the app does not compile
      # without it. Declared here rather than inherited from another job — deploy.yml learned that
      # one the hard way when moving the gate took the side effect with it.
      - name: Generate code
        run: melos exec --depends-on=build_runner -- dart run build_runner build

      # An APK, not an app bundle. `--split-per-abi` would be three files and a question about which
      # one to install; one fat APK is bigger and is the file a person can just open.
      #
      # NOT obfuscated, unlike the store build: this is for looking at behaviour, and a readable
      # stack trace is worth more here than an unreadable binary.
      - name: Build APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=SUPABASE_URL="${URL}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${KEY}"

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: kafoo-demo-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: How to install it
        run: |
          {
            echo "### Kafoo demo APK"
            echo ""
            echo "Points at \`${URL}\`."
            echo ""
            echo "1. Download **kafoo-demo-${{ github.run_number }}** from the Artifacts section"
            echo "   at the bottom of this page. It arrives as a zip; the APK is inside."
            echo "2. Open it on an Android phone. Allow \"install unknown apps\" when asked —"
            echo "   this build is signed with a debug key, which is why it is not publishable."
            echo "3. It opens on food, signed in to nothing. That is the Customer surface."
            echo ""
            echo "To sign in as a Cook, use one of the demo numbers in \`supabase/demo-data.json\`,"
            echo "with the code recorded beside it. They work only because the branch config"
            echo "declares them as test numbers; no SMS is sent."
            echo ""
            echo "**Search finds nothing until the database has embeddings.** Seeded Meals have no"
            echo "vector, so they show in browse and not in search — harder to find, never lost."
            echo "Run \`scripts/backfill-meal-embeddings.ts\` against it once; on a permanent"
            echo "database that is a one-off rather than a chore per build."
            echo ""
            echo "Full runbook: \`docs/ops/demo-environment.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
