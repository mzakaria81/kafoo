name: Deploy

# CD runs only on main (production). Every step is guarded by secret presence and
# by whether the thing it deploys exists, so with no secrets configured this
# workflow is a safe no-op — it neither fails nor deploys.
#
# Secrets that light steps up:
#   ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD
#     + ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD   -> a signed Android bundle
#   IOS_CERTIFICATE_BASE64 + IOS_CERTIFICATE_PASSWORD
#     + IOS_PROVISIONING_PROFILE_BASE64
#     + IOS_KEYCHAIN_PASSWORD                      -> a signed iOS archive
#
# THE WEB DEPLOY IS BACK, AND THIS TIME IT POINTS AT SOMETHING THAT EXISTS.
#
# Until 2026-08-03 this workflow carried a job that built `apps/admin` and pushed it to Cloudflare
# Pages, gated on `hashFiles('apps/admin/pubspec.yaml')`. That directory has never existed — E0's
# T045 defers an administrative surface until one is needed — so the condition could never be true
# and the step had never run once. The job reported success on every merge, which is the failure
# worth naming: not a broken deploy, but a green tick standing in for a deploy that was never
# possible.
#
# It was deleted rather than repaired, and the note left here said the job comes back when the
# technology decision lands. ADR-0008 Amendment 1 landed it on 2026-08-06 — Next.js and TypeScript
# on Cloudflare Workers, Customer flows only — and `apps/web/` is now a real directory with a real
# build. So the job below is written against a surface that exists.
#
# TWO THINGS IT DOES DIFFERENTLY FROM THE ONE THAT WAS DELETED. It does not guess whether the
# surface is there: `apps/web/package.json` is checked at STEP level, not job level, because
# `hashFiles()` in a job-level `if:` runs before checkout and always yields '' — the trap already
# recorded in docs/HANDOFF.md. And it refuses to publish a bundle carrying a service-role key,
# because `verify.sh` only catches a key TRACKED BY GIT and a build output is not a tracked file.
#
# Kafoo ships on Android and iOS (ADR-0006). The iOS job runs on a macOS
# runner, which costs about ten times an Ubuntu minute, so it stays gated
# behind the preflight job rather than starting and then skipping.
#
# MIGRATIONS ARE NOT THIS WORKFLOW'S JOB. Supabase Branching applies them to the
# production database when a pull request merges to main. The gate on a schema
# change is therefore the pull request review itself — there is no second approval
# between merging and the live database being altered. See docs/ops/preview-branches.md.
#
# This workflow used to run `db push`. That step was deleted rather than repaired after it failed
# on the merge of #17 and production received 20260802065138 anyway — Supabase Branching had
# already applied it. Two systems writing one production schema is worse than one: they race,
# neither knows what the other applied, and `db push` reconciling against a history Supabase has
# already advanced is how a migration gets applied twice or skipped. If this job is ever wanted
# back, turn Supabase Branching's production deploys off first. Do not run both.
#
# NOTE ON STORE SUBMISSION: this workflow deliberately stops at building and
# archiving a release candidate. It does not upload to App Store Connect or Play.
# A binary cannot be un-shipped, so submission stays a human decision made with
# release health in front of them — the same "machines propose, people approve"
# rule the constitution applies to the AI Assistant.
# See .claude/agents/release-engineer.md for the pre-submission checklist.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # The Customer web surface. ADR-0008 Amendment 1.
  #
  # Customer flows only — no Cook portal and no administrative surface without a new decision.
  web:
    name: web (Customer surface)
    runs-on: ubuntu-latest
    # The only job here that publishes to the internet rather than archiving an artifact a human
    # still has to submit, and until 2026-08-07 it was the only one that ran no gate at all. It
    # could have put a Customer-facing page live from a tree the gate would have refused.
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      # Step level, not job level. hashFiles() in a job-level `if:` runs before checkout and
      # always returns '', which silently skips the job while reporting success — exactly how the
      # deleted apps/admin job managed never to run.
      - id: check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/web is absent — the Customer web surface was not built."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: '22'

      - name: install
        if: steps.check.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: type-check and test
        if: steps.check.outputs.present == 'true'
        working-directory: apps/web
        run: |
          npm run lint
          npm test

      - name: build
        if: steps.check.outputs.present == 'true'
        working-directory: apps/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npx opennextjs-cloudflare build

      # A published bundle carrying a service-role key is a rotate-everything incident, and it is
      # the one thing verify.sh structurally cannot catch: it inspects tracked files, and this is
      # generated output. The check fails if it finds a key AND fails if it finds nothing to scan.
      - name: refuse a service-role key in the bundle
        if: steps.check.outputs.present == 'true'
        working-directory: apps/web
        run: npm run check:no-secret

      # Deploy only when Cloudflare credentials exist, and say so out loud when they do not.
      # A skipped deploy that looks like a successful one is what this whole comment block is about.
      - name: deploy
        if: steps.check.outputs.present == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: say when the deploy was skipped
        if: steps.check.outputs.present == 'true' && env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN is unset — the surface was built and verified but NOT published."

  # macOS runners cost roughly ten times an Ubuntu minute, so the iOS job must
  # not start at all without signing material. `secrets` is not available in a
  # job-level `if:`, so this cheap job exports the answer for `needs:` to read.
  #
  # IT ALSO RUNS THE GATE, ONCE, FOR EVERY RELEASE JOB. It used to run in both the Android and the
  # iOS job, which meant the same script over the same commit twice — and it broke on 2026-08-07
  # for a reason that duplication caused. E3 added an `authorization suites` step that needs a real
  # Postgres; ci.yml grew an install step to feed it and these jobs did not, so the check found no
  # database, `skip_or_fail` made that fatal under CI, and every deploy went red. Fixing it in place
  # meant installing Postgres, pgTAP and pgvector twice — including on a macOS runner, where the apt
  # route does not exist at all and the whole thing would have been rebuilt through Homebrew for a
  # job that never needed a database.
  #
  # One gate run on Ubuntu, gating both, removes that. The release jobs build; this one decides
  # whether they are allowed to.
  #
  # It is deliberately NOT dropped in favour of ci.yml, which runs the identical script on the same
  # commit. Both workflows fire on the same push and neither waits for the other, so nothing would
  # stop a release candidate being built and archived from a tree CI is about to call red.
  preflight:
    name: preflight (gate)
    runs-on: ubuntu-latest
    outputs:
      has_ios_signing: ${{ steps.check.outputs.has_ios_signing }}
    steps:
      - id: check
        env:
          HAS_IOS: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          echo "has_ios_signing=${HAS_IOS}" >> "$GITHUB_OUTPUT"
          echo "iOS signing secrets present: ${HAS_IOS}"

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      # Deno, for the same reason ci.yml installs it: the Edge Functions are Deno and three of the
      # gate's checks cannot run without it — `deno check`, the Edge Function unit tests, and the
      # prompt bundle drift check that catches a prompt edit never recompiled into the deployed
      # bundle.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The authorization suites run against a real Postgres of the major version
      # supabase/config.toml pins. Kept identical to ci.yml's step: one definition of the
      # environment the gate needs, in the two places that need it.
      - name: Install Postgres, pgTAP and pgvector
        run: |
          set -euo pipefail
          PG_MAJOR="$(grep -E '^major_version[[:space:]]*=' supabase/config.toml \
                      | head -1 | tr -dc '0-9')"
          . /etc/os-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${PG_MAJOR}" "postgresql-${PG_MAJOR}-pgtap" \
                                      "postgresql-${PG_MAJOR}-pgvector"

      # A release is not the place to discover a missing RLS policy.
      #
      # Unguarded, unlike the per-job version it replaces: that one was gated on the platform
      # project existing, so a checkout without `apps/mobile/android` skipped the gate entirely
      # rather than running it. Whether a release candidate can be built and whether the tree is
      # sound are different questions.
      - name: Run the gate
        run: ./scripts/verify.sh

  android:
    name: android release candidate
    runs-on: ubuntu-latest
    needs: preflight
    # NOTE: no job-level `if: hashFiles(...)`. hashFiles runs before any
    # checkout, against an empty workspace, so it always yields '' and would
    # skip this job on every run. The guards below are step-level, after the
    # checkout, which is where they can actually see the tree.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      # The platform projects exist, but detect rather than assume: a fresh
      # checkout that predates them, or a future restructure, should report the
      # gap plainly instead of failing somewhere deep inside Gradle.
      - name: Detect buildable Android project
        id: detect
        run: |
          if [ -d apps/mobile/android ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "apps/mobile/android does not exist — no Android project to build."
            echo "### Android release candidate: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`apps/mobile/android/\` does not exist yet. Run" >> "$GITHUB_STEP_SUMMARY"
            echo "\`flutter create --platforms=android,ios .\` in \`apps/mobile\`" >> "$GITHUB_STEP_SUMMARY"
            echo "to generate the platform projects, then this job builds." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.buildable == 'true'
        with:
          channel: stable
          cache: true

      - name: Activate melos and bootstrap
        if: steps.detect.outputs.buildable == 'true'
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        if: steps.detect.outputs.buildable == 'true'
        run: melos bootstrap

      # `*.g.dart` is gitignored, so a clean checkout has none of it and the app does not compile
      # without it — a `@riverpod` controller's `state` comes from the generated part file.
      #
      # This job never ran build_runner. It got the generated code as a SIDE EFFECT of the gate,
      # whose `codegen` check runs build_runner before checking anything, and which used to run in
      # this job. Moving the gate to `preflight` on 2026-08-07 took the side effect with it and the
      # release build failed on `Undefined name 'state'` — a dependency that had been satisfied by
      # accident for as long as the two steps happened to share a runner.
      #
      # Declared here now, because a build that needs generated code should say so rather than
      # inherit it from whatever ran first.
      - name: Generate code
        if: steps.detect.outputs.buildable == 'true'
        run: melos exec --depends-on=build_runner -- dart run build_runner build

      # The gate runs in `preflight`, which this job needs, so it has already passed by the time
      # anything here executes. Deno went with it — it was installed for the gate's three Deno
      # checks and nothing in this job uses it.

      # The signing identity is infrastructure. It arrives from secrets and is
      # written outside the working tree so it can never be committed.
      - name: Restore signing key
        if: steps.detect.outputs.buildable == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          # The keystore itself stays outside the working tree. Only
          # key.properties goes where Gradle reads it — apps/mobile/android/ —
          # because build.gradle resolves it via rootProject.file(). It is
          # git-ignored there; an env var is read by nothing.
          cat > apps/mobile/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/signing/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore staged outside the tree; key.properties placed for Gradle"

      # Build number is github.run_number: monotonic by construction, never
      # reused, never hand-edited. Both stores key update detection off it.
      #
      # --obfuscate with --split-debug-info makes the release AOT build
      # unreadable without the symbol files, so those files ARE the ability to
      # debug a production crash. They are archived below.
      - name: Build app bundle
        if: steps.detect.outputs.buildable == 'true'
        run: |
          flutter build appbundle --release \
            --build-number="${{ github.run_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols
        working-directory: apps/mobile

      - name: Archive release candidate
        if: steps.detect.outputs.buildable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kafoo-android-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      # Without these, a production crash report is a column of hex addresses.
      - name: Archive debug symbols
        if: steps.detect.outputs.buildable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kafoo-android-symbols-${{ github.run_number }}
          path: apps/mobile/build/symbols
          if-no-files-found: error
          retention-days: 90

      - name: Release notes
        working-directory: apps/mobile
        if: steps.detect.outputs.buildable == 'true'
        run: |
          echo "### Android release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build number: \`${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          # Report what the artifact actually is. Two weaker checks were tried
          # and both lied: secret presence proves nothing, and the presence of a
          # signature block is also true of a DEBUG-signed bundle, which cannot
          # be published. Inspect the certificate identity instead.
          AAB=$(find build/app/outputs/bundle/release -name '*.aab' | head -1)
          CERTDIR=$(mktemp -d)
          unzip -o -q "$AAB" -d "$CERTDIR" 'META-INF/*' 2>/dev/null || true
          CERT=$(find "$CERTDIR/META-INF" -maxdepth 1 \
                   \( -name '*.RSA' -o -name '*.EC' -o -name '*.DSA' \) 2>/dev/null | head -1)
          if [ -z "$CERT" ]; then
            echo "Signed: \`NO — unsigned bundle\`" >> "$GITHUB_STEP_SUMMARY"
          elif keytool -printcert -file "$CERT" 2>/dev/null | grep -q 'CN=Android Debug'; then
            echo "Signed: \`DEBUG KEY — NOT PUBLISHABLE\`" >> "$GITHUB_STEP_SUMMARY"
          else
            OWNER=$(keytool -printcert -file "$CERT" 2>/dev/null | grep -m1 '^Owner:' || echo 'Owner: unknown')
            echo "Signed: \`upload key\` — $OWNER" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -rf "$CERTDIR"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Not submitted. Run the pre-submission checklist in" >> "$GITHUB_STEP_SUMMARY"
          echo "\`.claude/agents/release-engineer.md\` before uploading." >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots and store copy are covered by the trust rules:" >> "$GITHUB_STEP_SUMMARY"
          echo "no synthetic Cooks, Meals, or Reviews; Arabic listing first." >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: ios release candidate
    runs-on: macos-latest
    needs: preflight
    # Only runs when signing material exists. Without this the job would burn
    # macOS minutes on every merge to produce an archive nobody can install.
    if: needs.preflight.outputs.has_ios_signing == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Detect buildable iOS project
        id: detect
        run: |
          if [ -d apps/mobile/ios ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "### iOS release candidate: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "\`apps/mobile/ios/\` does not exist." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.buildable == 'true'
        with:
          channel: stable
          cache: true

      - name: Activate melos
        if: steps.detect.outputs.buildable == 'true'
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        if: steps.detect.outputs.buildable == 'true'
        run: melos bootstrap

      # Same reason as the Android job: `*.g.dart` is gitignored, the app does not compile without
      # it, and this job used to receive it as a side effect of the gate step it no longer runs.
      - name: Generate code
        if: steps.detect.outputs.buildable == 'true'
        run: melos exec --depends-on=build_runner -- dart run build_runner build

      # The gate runs in `preflight`, which this job already needs. Keeping a copy here would have
      # meant a Postgres, pgTAP and pgvector install on a macOS runner — through Homebrew, since
      # the apt route does not exist there — to satisfy a database check for a job that builds an
      # iOS archive. Deno went with it, for the same reason it did in the Android job.

      # iOS needs a certificate AND a provisioning profile, unlike Android's
      # single keystore. Both land in a temporary keychain that is deleted with
      # the runner; neither touches the working tree.
      - name: Install signing certificate and profile
        if: steps.detect.outputs.buildable == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          printf '%s' "$CERT_B64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "signing material installed into a temporary keychain"

      # Build number from github.run_number: monotonic, never reused. Symbols
      # are archived for the same reason as Android — an obfuscated AOT crash
      # report is unreadable without them.
      - name: Build IPA
        if: steps.detect.outputs.buildable == 'true'
        working-directory: apps/mobile
        run: |
          flutter build ipa --release \
            --build-number="${{ github.run_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Archive release candidate
        if: steps.detect.outputs.buildable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kafoo-ios-${{ github.run_number }}
          path: apps/mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Archive debug symbols and dSYMs
        if: steps.detect.outputs.buildable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kafoo-ios-symbols-${{ github.run_number }}
          path: |
            apps/mobile/build/symbols
            apps/mobile/build/ios/archive/*.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 90

      # The keychain dies with the runner, but deleting it explicitly means a
      # later step in this job cannot reach the signing identity.
      - name: Remove signing material
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Release notes
        if: steps.detect.outputs.buildable == 'true'
        run: |
          echo "### iOS release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build number: \`${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Not submitted. Run the pre-submission checklist in" >> "$GITHUB_STEP_SUMMARY"
          echo "\`.claude/agents/release-engineer.md\` before uploading." >> "$GITHUB_STEP_SUMMARY"
          echo "Store listing must be Egyptian Arabic first; no screenshot may" >> "$GITHUB_STEP_SUMMARY"
          echo "show an invented Cook, Meal, or Review." >> "$GITHUB_STEP_SUMMARY"
