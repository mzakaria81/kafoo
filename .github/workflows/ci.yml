name: CI

# The gate. Same definition of "passing" as local: this runs ./scripts/verify.sh,
# nothing more, nothing less. See scripts/verify.sh.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Edge Functions are Deno, and without it the three checks that cover them —
      # `deno check`, their unit tests, and prompt bundle drift — skipped and
      # reported ok on every pull request since the gate was written. The only code
      # in Kafoo that talks to a model provider was type-checked nowhere but a
      # developer's laptop. verify.sh now fails rather than skips when CI is set, so
      # this step going missing is loud instead of silent.
      #
      # Major version pinned; scripts/install-toolchain.sh takes the latest 2.x, so
      # the two track each other rather than drifting apart.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Activate melos
        run: dart pub global activate melos

      - name: Add pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # Resolve workspace dependencies before the gate. Without this,
      # `melos run analyze` runs against unresolved packages.
      - name: Bootstrap workspace
        run: melos bootstrap

      # jq is preinstalled on ubuntu-latest runners; verify.sh needs it.
      - name: Run gate
        run: ./scripts/verify.sh
