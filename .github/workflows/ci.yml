name: CI

# The gate. Same definition of "passing" as local: this runs ./scripts/verify.sh,
# nothing more, nothing less. See scripts/verify.sh.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Edge Functions are Deno, and without it the three checks that cover them —
      # `deno check`, their unit tests, and prompt bundle drift — skipped and
      # reported ok on every pull request since the gate was written. The only code
      # in Kafoo that talks to a model provider was type-checked nowhere but a
      # developer's laptop. verify.sh now fails rather than skips when CI is set, so
      # this step going missing is loud instead of silent.
      #
      # Major version pinned; scripts/install-toolchain.sh takes the latest 2.x, so
      # the two track each other rather than drifting apart.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Activate melos
        run: dart pub global activate melos

      - name: Add pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # Resolve workspace dependencies before the gate. Without this,
      # `melos run analyze` runs against unresolved packages.
      - name: Bootstrap workspace
        run: melos bootstrap

      # The gate now runs the pgTAP authorization suites itself, so this job needs a database.
      #
      # It duplicates the `authorization suites` job's install, and that is deliberate rather than
      # overlooked: the two jobs run in parallel so the wall-clock cost is one install, and the
      # alternative — letting the gate skip the suites here because another job covers them — is
      # the exemption that let three Deno checks report ok for weeks without running.
      #
      # Keep this list in step with `scripts/install-toolchain.sh` and `authorization.yml`.
      - name: Install Postgres, pgTAP and pgvector
        run: |
          set -euo pipefail
          PG_MAJOR="$(grep -E '^major_version[[:space:]]*=' supabase/config.toml \
                      | head -1 | tr -dc '0-9')"
          . /etc/os-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${PG_MAJOR}" "postgresql-${PG_MAJOR}-pgtap" \
                                      "postgresql-${PG_MAJOR}-pgvector"

      # The Customer web surface is TypeScript and needs its dependencies resolved before the gate
      # can type-check it. Without these two steps the "web surface" check found no node_modules,
      # printed NOT CHECKED and reported ok — on every pull request since it was written. Only
      # deploy.yml installed them, and that runs after the merge, which is the wrong side of the
      # gate to discover a type error.
      #
      # verify.sh now fails rather than skips when CI is set, so these steps going missing is loud
      # instead of silent. Node version pinned to match deploy.yml — one definition of the runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web surface dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      # jq is preinstalled on ubuntu-latest runners; verify.sh needs it.
      #
      # Not run under sudo. The gate only needs root for the database step, and it acquires that
      # itself — running the whole thing as root would put Flutter's pub cache and every generated
      # file in root's home, which is a large change to make for one check.
      - name: Run gate
        run: ./scripts/verify.sh

  # ANDROID COMPILES NOWHERE ELSE BEFORE A MERGE, AND THAT IS WHAT THIS FIXES.
  #
  # The gate above runs `dart analyze` and the tests. Neither invokes Gradle, so an
  # Android build can be broken in ways nothing here can see: a plugin raising
  # minSdk, a Gradle or AGP version conflict, a manifest merge failure, a missing
  # NDK. Until now the first thing to actually compile the app was `deploy.yml`,
  # which runs AFTER the merge — so the pull request went green, main went red, and
  # somebody unpicked it afterwards.
  #
  # A SEPARATE JOB, NOT A STEP IN THE GATE. It runs in parallel, so it adds no
  # wall-clock to the feedback a pull request is waiting on. The duplicated Flutter
  # setup is the same trade the `authorization suites` job already makes and is
  # deliberate for the same reason.
  #
  # DEBUG, NOT RELEASE, AND THE DIFFERENCE MATTERS. A debug build needs no signing
  # secrets, so it works on a fork's pull request, and it exercises the whole Gradle
  # and plugin path where nearly all of these breakages live. What it does NOT cover
  # is R8 shrinking and obfuscation, which only run in release — that stays covered
  # by the release build in `deploy.yml` on merge. Cheap check early, thorough check
  # late, rather than one of them twice.
  #
  # No artifact is uploaded on purpose. This is a check, not a deliverable; a debug
  # APK from a pull request is of no use to anyone.
  android-build:
    # THE NAME CARRIES THE CAVEAT, because the name is the only part of this most
    # people ever see. A green check reading "android compiles" claims more than a
    # debug build delivers — R8 shrinking and obfuscation are release-only, so a
    # failure that only appears under minification passes here. The comment below
    # explains that; a comment inside a YAML file is invisible on the checks page,
    # which is where the claim is actually read. Raised by release-engineer.
    name: android compiles (debug — no R8/shrink coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Step level, after checkout — a job-level `hashFiles()` runs against an empty
      # workspace and always yields '', which would skip this on every run. That trap
      # is already recorded in deploy.yml and docs/HANDOFF.md.
      - name: Detect buildable Android project
        id: detect
        run: |
          if [ -d apps/mobile/android ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "apps/mobile/android does not exist — nothing to compile."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.buildable == 'true'
        with:
          channel: stable
          cache: true

      - name: Activate melos
        if: steps.detect.outputs.buildable == 'true'
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        if: steps.detect.outputs.buildable == 'true'
        run: melos bootstrap

      # `*.g.dart` and `*.freezed.dart` are git-ignored, so a clean checkout does not
      # contain them and the app does not compile without them — a `@riverpod`
      # controller's `state` lives in the generated part file. deploy.yml learned this
      # the hard way when it inherited generated code as a side effect of whatever ran
      # first on the same runner, and broke the day the gate moved to another job.
      - name: Generate code
        if: steps.detect.outputs.buildable == 'true'
        run: melos exec --depends-on=build_runner -- dart run build_runner build

      - name: Build debug APK
        if: steps.detect.outputs.buildable == 'true'
        run: flutter build apk --debug
        working-directory: apps/mobile
