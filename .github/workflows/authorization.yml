name: Authorization

# Runs supabase/tests/*.sql — the RLS suites — against a real Postgres built in the runner by
# scripts/local-db.sh. That script starts a cluster of the major version supabase/config.toml pins,
# applies every migration and the seed, and runs the suites against the result.
#
# THIS USED TO RUN AGAINST A SUPABASE PREVIEW BRANCH, and it no longer does. The preview branch was
# a real, internet-facing Supabase project spun up per pull request, and it was billed. It also made
# the constitution's central requirement expensive: a negative test must be SEEN to fail before the
# policy it tests exists, and with no local database the only way to observe that red was to push
# the test in its own commit and wait for a preview branch to build. One extra push and a round trip
# for every red.
#
# Docker was never the requirement — Postgres was, and the runner has it. The change removes a
# recurring cost and a feedback loop measured in minutes, and replaces both with a run that takes
# seconds and needs no secrets at all.
#
# WHAT IS LOST, stated plainly rather than discovered later. The preview branch was real Supabase:
# real Auth issuing real JWTs, real PostgREST, the real storage service. This is Postgres plus the
# smallest stand-in for those that the migrations actually reference — see
# scripts/local-db-bootstrap.sql, which says what it fakes and why. So this job proves the schema,
# the constraints, the triggers and the policies as SQL. It cannot prove that Supabase's own
# services behave as assumed around them.
#
# Two of those stand-ins are worth knowing about because they are where a wrong result would come
# from: auth.uid() reading request.jwt.claims, and the absence of a DELETE grant on storage.objects
# standing in for Supabase routing deletion through its Storage API.
#
# WHAT MAKES THIS MEANINGFUL. These suites were mutation-tested on 2026-08-02, and again against
# this harness on 2026-08-03: broadening the kitchen_profiles SELECT policy to `USING (true)` turns
# two assertions red, and a clean rebuild returns to green. A suite that has only ever been green
# may be incapable of red, so if you add assertions here, break the policy on purpose once and watch
# this job fail before you trust it.

on:
  pull_request:
    branches: [main, develop]
    # Only when something the suites read has changed. Migrations, the seed, the suites themselves,
    # and the harness that runs them.
    paths:
      - 'supabase/**'
      - 'scripts/local-db.sh'
      - 'scripts/local-db-bootstrap.sql'
      - '.github/workflows/authorization.yml'

concurrency:
  group: authorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: authorization suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The runner ships a Postgres, but not necessarily the major version Supabase runs, and not
      # pgTAP. Read the pinned version from config.toml rather than hardcoding it here — that pin is
      # the single place the version is decided, and a second copy is a second thing to get wrong.
      - name: Install Postgres and pgTAP
        run: |
          set -euo pipefail
          PG_MAJOR="$(grep -E '^major_version[[:space:]]*=' supabase/config.toml \
                      | head -1 | tr -dc '0-9')"
          echo "supabase/config.toml pins Postgres ${PG_MAJOR}"
          . /etc/os-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${PG_MAJOR}" "postgresql-${PG_MAJOR}-pgtap"
          /usr/lib/postgresql/"${PG_MAJOR}"/bin/postgres --version

      # No `if:` guard and no secrets. The previous version of this job skipped itself when the
      # Supabase credentials were absent, and printed a warning saying the policies in the pull
      # request were unverified — a skipped check that is easy to read as a passing one. There is
      # nothing left to be absent, so the job either proves the policies or fails.
      - name: Run the authorization suites
        run: sudo -E ./scripts/local-db.sh test

      - name: Summary
        if: always()
        run: |
          {
            echo "### Authorization suites"
            echo ""
            echo "Run against a local Postgres matching \`supabase/config.toml\`, not a Supabase"
            echo "preview branch. Proves the schema, constraints, triggers and policies as SQL."
            echo "Does not exercise Supabase Auth, PostgREST, or the Storage service —"
            echo "see \`scripts/local-db-bootstrap.sql\` for what stands in for them."
          } >> "$GITHUB_STEP_SUMMARY"
